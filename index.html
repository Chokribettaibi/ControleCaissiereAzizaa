<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contrôle Caissière</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-left">
          <p class="header-title">
            Contrôle caissière <span class="italic">commercial x</span>
          </p>
        </div>
        <div class="header-right">
          <p class="store-name">Winstore</p>
        </div>
      </header>

      <main class="content">
        <section class="left-section">
          <h2>Répartion des espèces</h2>

          <div class="form-group">
            <label>Pièce 5 Millimes :</label>
            <input type="number" id="piece5Millimes"value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 10 Millimes :</label>
            <input type="number" id="piece10Millimes" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 20 Millimes :</label>
            <input type="number" id="piece20Millimes" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 50 Millimes :</label>
            <input type="number" id="piece50Millimes" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 100 Millimes :</label>
            <input type="number" id="piece100Millimes" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 200 Millimes :</label>
            <input type="number" id="piece200Millimes" value="O" />
          </div>
          <div class="form-group">
            <label>Pièce 0.5 Dinar :</label>
            <input type="number" id="piece500Millimes" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 1 Dinar :</label>
            <input type="number" id="piece1Dinar" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 2 Dinars :</label>
            <input type="number" id="piece2Dinars" value="0" />
          </div>
          <div class="form-group">
            <label>Pièce 5 Dinar :</label>
            <input type="number" id="piece5Dinars" value="0" />
          </div>
          <div class="form-group">
            <label>Billet 5 Dinars :</label>
            <input type="number" id="billet5Dinars" value="0" />
          </div>
          <div class="form-group">
            <label>Billet 10 Dinars :</label>
            <input type="number" id="billet10Dinars" value="0" />
          </div>
        </section>
        <section class="right-section">
          <h2>Contenu du tiroir</h2>
          <div class="form-group">
            <label>Espèces :</label>
            <input type="text" id="especes" value="0.000" />
          </div>
          <div class="form-group">
            <label>Chéque :</label>
            <input type="number" id="cheque" value="0.000" />
          </div>
          <div class="form-group">
            <label>Carte Bancaire :</label>
            <input type="number" id="carteBancaire" value="0.000" />
          </div>
          <div class="form-group">
            <label>BAD :</label>
            <input type="number" id="bad" value="0.000" />
          </div>
          <div class="form-group">
            <label>carte sodexo+Pluxee :</label>
            <input type="number" id="carteSodexo" value="0.000" />
          </div>
          <div class="form-group">
            <label>Vouchers Aziza :</label>
            <input type="number" id="vouchersAziza" value="0.000" />
          </div>
          <div class="form-group">
            <label>Cheque Cadeau Aziza :</label>
            <input type="number" id="chequeCadeauAziza" value="0.000" />
          </div>
          <div class="form-group">
            <label>Bons D'Achat Aziza N :</label>
            <input type="number" id="bonsDAchatAziza" value="0.000" />
          </div>
          <div class="form-group">
            <label>Reception Lait :</label>
            <input type="number" id="receptionLait" value="0.000" />
          </div>
          <div class="form-group">
            <label>AZIZA PAY :</label>
            <input type="number" id="azizaPay" value="0.000" />
          </div>
          <div class="form-group">
            <label>Servimax TR :</label>
            <input type="number" id="servimaxTR" value="0.000" />
          </div>
          <div class="form-group">
            <label>Servimax KDO :</label>
            <input type="number" id="servimaxKDO" value="0.000" />
          </div>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-note">
          Le montant saisi en espèces doit représenter la totalité du tiroir
          caisse
        </p>
        <div class="buttons">
          <button class="btn btn-primary">Modification</button>
          <button class="btn btn-success">OK caisse</button>
          <button class="btn btn-danger">Annuler</button>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
